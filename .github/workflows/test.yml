name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The floor is 1.20.x rather than the `go 1.15` directive master still
      # declares, so 1.15 through 1.19 are not built here. It matches the
      # `go 1.20` directive that agent/update-go-dependencies sets, which
      # golang.org/x/crypto v0.31.0 requires. A newer toolchain builds the older
      # module, so nothing breaks if this merges first; the gap closes when that
      # branch lands.
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.20.x
          - os: ubuntu-latest
            go: 1.26.x
          - os: windows-latest
            go: 1.26.x
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # Without this guard the Test step below can only ever fail on a compile
      # error. The repository carried no *_test.go files when this workflow was
      # written, so breaking pkg/oidc/refresh.go still printed "no test files"
      # for every package and exited 0. The first tests arrive on the branches
      # this one pairs with, starting with agent/fix-windows-keyring.
      - name: Require discoverable tests
        shell: bash
        run: |
          packages="$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)"
          if [ -z "${packages}" ]; then
            echo "::error::go list found no package with test files, so the Test step cannot fail on a regression."
            exit 1
          fi
          echo "Packages with tests:"
          echo "${packages}"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
